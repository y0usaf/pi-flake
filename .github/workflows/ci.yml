name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Flake check (builds pi, extension tests, lint, patch assertions)
        run: nix flake check -L

      # Package names are enumerated from the flake so this step cannot go
      # stale when an extension is added, renamed, or retired.
      - name: Build every exposed package
        run: |
          set -euo pipefail
          system="$(nix eval --raw --impure --expr 'builtins.currentSystem')"
          mapfile -t packages < <(
            nix eval --json ".#packages.${system}" --apply builtins.attrNames | jq -r '.[]'
          )
          echo "Building: ${packages[*]}"
          for pkg in "${packages[@]}"; do
            echo "::group::nix build .#${pkg}"
            nix build ".#${pkg}" -L --no-link
            echo "::endgroup::"
          done
