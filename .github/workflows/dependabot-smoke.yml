name: dependabot-smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  root-lock-refresh:
    name: smoke/root-lock-refresh
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Refresh root temp lock
        run: nix flake update nixpkgs piSrc --output-lock-file "$RUNNER_TEMP/flake.lock"

      - name: Show root lock diff
        run: diff -u flake.lock "$RUNNER_TEMP/flake.lock" || true

      - name: Build root pi against temp lock
        run: nix build .#pi --reference-lock-file "$RUNNER_TEMP/flake.lock" -L

  # Subflake list is discovered from the tree so it cannot go stale when an
  # extension is added, renamed, or retired.
  discover-extensions:
    name: smoke/discover
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.list.outputs.dirs }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List extension subflakes
        id: list
        run: |
          set -euo pipefail
          dirs="$(find extensions -mindepth 2 -maxdepth 2 -name flake.nix -printf '%h\n' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "dirs=${dirs}" >> "$GITHUB_OUTPUT"
          echo "Discovered: ${dirs}"

  extension-lock-refresh:
    name: smoke/${{ matrix.dir }}
    needs: discover-extensions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.discover-extensions.outputs.dirs) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Refresh extension temp lock
        working-directory: ${{ matrix.dir }}
        run: nix flake update nixpkgs --output-lock-file "$RUNNER_TEMP/flake.lock"

      - name: Show extension lock diff
        working-directory: ${{ matrix.dir }}
        run: diff -u flake.lock "$RUNNER_TEMP/flake.lock" || true

      - name: Build extension against temp lock
        working-directory: ${{ matrix.dir }}
        run: nix build .#default --reference-lock-file "$RUNNER_TEMP/flake.lock" -L
