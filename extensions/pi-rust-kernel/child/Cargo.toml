[package]
name = "pi-rust-kernel-child"
version = "0.1.0"
edition = "2021"
description = "Persistent Rust evaluation kernel for the pi-rust-kernel pi extension"
license = "MIT"

[dependencies]
evcxr = "0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"

[profile.release]
opt-level = 1
